[package]
name = "t4-engine-rs"
version = "1.1.0"
edition = "2021"
description = "THREAD 4 engine core — Rust twin of mini-services/t4-engine (bun:sqlite SSoT): hash chain, projections, deterministic compiler, Theme Expansion (gate 25), live SSE, CLI. Verifies the production chain byte-exactly; writes go to its own scratch chronicle."
publish = false

[lib]
name = "t4_engine_rs"
path = "src/lib.rs"

[[bin]]
name = "t4-engine-rs"
path = "src/main.rs"

[[bin]]
name = "t4"
path = "src/bin/t4.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
