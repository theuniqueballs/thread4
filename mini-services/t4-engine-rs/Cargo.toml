[package]
name = "t4-engine-rs"
version = "1.0.0"
edition = "2021"
description = "THREAD 4 engine core — Rust twin of mini-services/t4-engine (bun:sqlite SSoT): hash chain, projections, deterministic compiler, RPC. Verifies the production chain byte-exactly; writes go to its own scratch chronicle."
publish = false

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 2
