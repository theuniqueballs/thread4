── VALIDATION NOTE v3.0 ────────────────────────────────────────────
Total: 240/240 codes (60 base + 180 new, the ×4 order honored exact).
Family ledger: base 48 + erotic PL49-60 (12) + ecchi_classic (24) +
dynamic_v2 (24) + env_interaction (24) + performance_mirror (24) +
partner_implied (24) + erotic_presentation_v2 (24) + micropose (24) +
threshold_limen (12) = 240.
Category ledger (rough, cross-family): VERTICAL ~76 · SEATED ~42 ·
DYNAMIC ~60 · KNEELING ~24 · HORIZONTAL ~21 · BENT ~15 (+ micropose
close variants riding their base categories). Risk: LOW ~95 · MID ~88 ·
HIGH ~57 — C015's >=30% MID/HIGH floor now trivially satisfiable with
zero repeats for a whole batch of 21.
NO-REPEAT AUDIT: every new code checked against PL01-PL60 for shape
overlap; known near-neighbors documented by design (PL188 vs PL84 —
extension vs ankle-cross; PL194 vs PL147 — chest-lean vs eye-lock;
PL195 vs PL76 — high-bed down-gaze vs level crawl; PL232 vs PL29 —
reflection-world claim vs mirror touch): each pair differs on the
camera relationship or the body's key axis, per §17A's reword doctrine.

USAGE DOCTRINE v3.0 (the POSE-DECISIVE audit's standing law):
1. THE STANDING-DEFAULT IS RETIRED: PL01 Neutral Stand may not be a
   VOLT/X prompt's primary pose from N27 on; static VERTICAL codes
   (PL01/PL02/PL06/PL08/PL19/PL29) cap at 2 per batch TOTAL, never in
   X slots (SUCCESS_LOG RF-001: «набор девочек, стоящих влево, вправо и
   в профиль»).
2. POSE-FIRST DESIGN: the PL code is chosen BEFORE the prose, and the
   frame is composed around it — one striking pose per prompt is the
   scroll-stop engine (RF-001: «Охуенная поза решила всё»).
3. EROTIC-PRESENTATION GREED, RAISED: >=4 codes from PL49-60 +
   PL181-204 per 21-batch (was >=2), >=1 per act; both families rotate,
   never one code twice in a batch.
4. ECCHI CLASSIC = GRAMMAR, not garnish: PL61-84 are the genre's own
   poses — draw >=3 per batch, censored register enforced (§40/§41/C072:
