dynamic_v2:
- {id: PL85, name: "Pirouette Bell", sd: "mid-full-turn on one toe, arms rounded overhead, skirt at its maximum bell, the face arriving around last", category: DYNAMIC, risk: MID}
- {id: PL86, name: "Hair-Whip Turn", sd: "spine mid-rotation, hair mid-whip across the face it just left, chin leading the turn, one arm swept to the side for the momentum", category: DYNAMIC, risk: MID}
- {id: PL87, name: "Rail Vault", sd: "mid-vault over a low railing, one hand on the rail, legs swung to one side, the other hand pinning the skirt's hem mid-flight", category: DYNAMIC, risk: HIGH}
- {id: PL88, name: "Stair-Skip Descent", sd: "skipping down stairs mid-skip, one hand skimming the rail, the ponytail leading the body down, every step a small bounce", category: DYNAMIC, risk: LOW}
- {id: PL89, name: "Curtain Swagger", sd: "pushing through a heavy curtain mid-stride, the fabric wrapping one shoulder as she passes, chin first into the next room", category: DYNAMIC, risk: MID}
- {id: PL90, name: "Swing Forward Apex", sd: "on a swing at the forward apex, legs extended, chain-grips high, hair lifted with the arc, the grin of stolen momentum", category: DYNAMIC, risk: LOW}
- {id: PL91, name: "Trampoline Float", sd: "mid-bounce at the zero-gravity top, hair and skirt floating, limbs loose, eyes wide with the steal", category: DYNAMIC, risk: MID}
- {id: PL92, name: "Handstand Split", sd: "inverted on both palms, legs lowering into a slow split overhead, one ankle crossed to govern the skirt's fall", category: DYNAMIC, risk: HIGH}
- {id: PL93, name: "Cartwheel Frame", sd: "mid-cartwheel, inverted, legs in a wide V against the sky, hands planted, hair hanging toward the ground's decision", category: DYNAMIC, risk: HIGH}
- {id: PL94, name: "Pool-Exit Push-Up", sd: "arms straight on the pool rim, body half-lifted from the water, one knee finding the tiles, water sheeting off the back's line", category: DYNAMIC, risk: HIGH}
- {id: PL95, name: "No-Hands Coast", sd: "standing tall on moving pedals, no hands, spine long, arms back at the sides, hair doing the steering", category: DYNAMIC, risk: MID}
- {id: PL96, name: "Invisible Partner's Dip", sd: "held mid-dip by no one: knees bent, spine arched back over the missing arm, one arm arched overhead as if received, head given to gravity", category: DYNAMIC, risk: HIGH}
- {id: PL97, name: "Run-Look-Back", sd: "mid-run, torso turned enough to glance over the shoulder, one arm still pumping, stride at its widest, hair streaming forward", category: DYNAMIC, risk: MID}
- {id: PL98, name: "Hedge Leap", sd: "mid-leap over a low hedge or puddle, knees tucked, arms up, skirt mid-float, the landing still owed", category: DYNAMIC, risk: LOW}
- {id: PL99, name: "Floor Slide", sd: "sliding on polished floor on the side of one leg, the other extended, one hand near the floor for the steer, hair trailing the slide's wake", category: DYNAMIC, risk: HIGH}
- {id: PL100, name: "Skirt-Fan Twirl", sd: "both hands mid-twirling the skirt out to each side like a fan, chin up, turning under own weather", category: DYNAMIC, risk: MID}
- {id: PL101, name: "Fence Hop-Down", sd: "mid-hop down from a fence, one foot landing, the other leg still trailing height, hair following a half-beat late", category: DYNAMIC, risk: MID}
- {id: PL102, name: "Tray-Level Recovery", sd: "post-slip balance catch on one foot, arms in full asymmetry, the held tray or book still perfectly level — the save as the pose", category: DYNAMIC, risk: LOW}
- {id: PL103, name: "Rolling Exit", sd: "rolling from bed or sofa mid-roll onto both feet, a sheet still wound around one leg, hair upside-down and arriving", category: DYNAMIC, risk: MID}
- {id: PL104, name: "Dance-Break Snap", sd: "mid-dance pose hit: knees bent inward, wrists snapping from crossed to open, head tilted into the beat's pocket", category: DYNAMIC, risk: MID}
- {id: PL105, name: "Sprinter's Set", sd: "the start position held as a pose: fingertips to the ground, hips high, one knee folded nearly to the brow, eyes forward down the lane", category: BENT, risk: HIGH}
- {id: PL106, name: "Windowsill Drop-In", sd: "mid-drop from a windowsill, hands still gripping the sill behind, body angled toward the floor, feet finding the first contact", category: DYNAMIC, risk: MID}
- {id: PL107, name: "Branch Swing-Through", sd: "swinging forward on a low branch, knees bent beneath, one arm's grip the whole anchor, skirt at the swing's mercy", category: DYNAMIC, risk: HIGH}
- {id: PL108, name: "Skid-Stop Turn", sd: "mid-skid into a turn, weight low, one hand's knuckles near the ground, dust or spray rising behind the stop", category: DYNAMIC, risk: HIGH}

