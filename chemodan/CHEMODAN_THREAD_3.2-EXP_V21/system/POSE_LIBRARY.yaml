- {id: PL68, name: "Apron-Only Oven Bend", sd: "bending to a oven's low door, apron strings the back's only claim, heels lifting, both hands on the handle, the bend squaring the shoulders", category: BENT, risk: HIGH}
- {id: PL69, name: "Doorframe Head-Tilt", sd: "one shoulder to the doorframe, head tilted to rest on it, wrists crossed low in front, hip released from the line", category: VERTICAL, risk: LOW}
- {id: PL70, name: "Wariza Sit-Back", sd: "sitting on the floor between own heels, knees together, weight dropped back onto one arm, the other hand loose at the thigh, the pose of the tired homebody", category: SEATED, risk: MID}
- {id: PL71, name: "Towel Clamp Stand", sd: "both arms crossed tight over the chest, hands gripping a bath towel's upper edge to the collarbone, hip cocked, hair still wet, the whole pose one deep breath from incident", category: VERTICAL, risk: MID}
- {id: PL72, name: "Bath-Rim Knee-Sit", sd: "perched on the tub's wide rim, one knee up, the other foot trailing in the water, shoulders wet, hair piled high and dripping", category: SEATED, risk: MID}
- {id: PL73, name: "Forward Crawl Glance", sd: "crawling forward on knees and one palm, the other arm reaching ahead, head turned back mid-motion to glance at something behind", category: KNEELING, risk: MID}
- {id: PL74, name: "Yawn Arc", sd: "mid-yawn with both arms overhead in a full stretch, back curved into a comma, eyes shut, the body's whole honesty on display", category: VERTICAL, risk: MID}
- {id: PL75, name: "Under-Chin Cup", sd: "sitting cross-legged, both palms cupping own chin, elbows on knees, leaned forward into the viewer's space with full attention", category: SEATED, risk: LOW}
- {id: PL76, name: "Bed Knee-Crawl", sd: "crawling over a bed toward the viewer, one knee advancing past the other, a sheet dragging from the trailing hand, shoulders low and level", category: KNEELING, risk: HIGH}
- {id: PL77, name: "Two-Arm Shelf Tiptoe", sd: "on tiptoes at a high shelf, both arms stretched full overhead, shirt risen past the ribs, heels together and lifting", category: VERTICAL, risk: MID}
- {id: PL78, name: "Slipper-Hunt Hop", sd: "standing on one leg mid-hop, the other foot raised behind, looking down at the floor for the missing slipper, arms out in comic asymmetry", category: DYNAMIC, risk: LOW}
- {id: PL79, name: "Covers-Peek Kneel", sd: "kneeling inside a bed's covers drawn to the chin, sheet held at the chest in both fists, only the eyes and crown out, peeking", category: KNEELING, risk: LOW}
- {id: PL80, name: "Caught Mid-Change", sd: "frozen half-in half-out of a garment, one arm in a sleeve, one leg out of the hem, head snapped toward the door", category: VERTICAL, risk: HIGH}
- {id: PL81, name: "Over-Lap Lean", sd: "leaning forward across a low table toward the viewer, palms flat on the far edge, chin low, the neckline falling with gravity", category: BENT, risk: HIGH}
- {id: PL82, name: "Fan-It Flush", sd: "kneeling upright, one hand fanning own flushed face, the other pressing a cold bottle to the collarbone, eyes squeezed half-shut", category: KNEELING, risk: LOW}
- {id: PL83, name: "Strap Adjust", sd: "standing, mid-adjusting a pack's or garment's strap over one shoulder with both hands, elbows high, hips turned away", category: VERTICAL, risk: LOW}
- {id: PL84, name: "Ankle-Cross Sock-Pull", sd: "seated on a bench edge, one ankle crossed over the other knee, mid-drawing a sock or stocking up the raised calf, toe pointed", category: SEATED, risk: HIGH}

