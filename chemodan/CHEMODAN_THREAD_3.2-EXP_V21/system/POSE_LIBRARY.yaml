POSE_LIBRARY.yaml — THREAD 3.0
Fills the gap in THREAD 2.0's pose axis: PL01–PL48 existed only as IDs
grouped by category, with risk classification for 12/48 and 5 codes
(PL01, PL13, PL18, PL26, PL30) unassigned to any category.
Every code below now has an actual physical description, consistent
with the ontology's doctrine: "Pose = how body organizes space for light."
Risk = how much the pose itself implies exposure/vulnerability,
independent of wardrobe/NCS (those stack on top, they don't replace this).
