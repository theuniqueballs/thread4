performance_mirror:
- {id: PL133, name: "Mirror Strap-Fix Glance", sd: "back to the mirror, glancing at the reflection over one shoulder, one strap mid-rescue at the shoulder, the fix performed for the glass", category: VERTICAL, risk: MID}
- {id: PL134, name: "Fitting-Room Lean-In", sd: "leaning into the fitting mirror to interrogate the neckline, breath fogging the glass, one hand flattening the fabric's lie", category: BENT, risk: MID}
- {id: PL135, name: "Dress-Twirl Verdict", sd: "the dress mid-twirl caught from the side, watching its own bell in the mirror with the verdict still pending", category: DYNAMIC, risk: LOW}
- {id: PL136, name: "Stage Bow", sd: "the post-number bow: knees together, one arm folded across the waist, the other swept wide, head dipped to the apron's edge", category: VERTICAL, risk: LOW}
- {id: PL137, name: "Runway Stride", sd: "mid-stride runway walk, chin level, one hip at the swing's peak, gaze fixed past everyone in the room", category: DYNAMIC, risk: MID}
- {id: PL138, name: "Self-Serenade", sd: "eyes shut, one hand flat on own chest, the other gripping own hair at the crown like a cord, mid-note", category: VERTICAL, risk: MID}
