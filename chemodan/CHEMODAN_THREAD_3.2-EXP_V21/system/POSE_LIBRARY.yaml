EROTIC PRESENTATION FAMILY — PL49-PL60 (POSE_LIBRARY v2.0, 2026-09-10)
Author order, verbatim: «Расширишь методы и приёмы для R, R+ — в частности,
эротические позы. Держит попку двумя руками, наклоняется так, что видно
Cleavage и всё, что там происходит — и так далее и тому подобное.»
Doctrine: these poses ARE RATING_MAP class-F/G carrier sources — the pose
carries the presentation; the tier's state and degree ride on top (a PL49-60
prompt with an honest state combo + carriers earns its tier without the pose
doing anything illegal; the pose is the ARMATURE, not the rating). Risk = HIGH
for all 12 — they feed C015's ≥30% MID/HIGH floor from the strong side.
