- {id: PL140, name: "Arabesque Line", sd: "torso pitched forward on one leg, the other leg extended behind at height, both arms long, the body one diagonal", category: DYNAMIC, risk: HIGH}
- {id: PL141, name: "Fan-Snap Open", sd: "kneeling upright, a fan mid-snap open at the chin, wrist still turning from the strike", category: KNEELING, risk: MID}
- {id: PL142, name: "Kimono Sleeve-Flash", sd: "the walking turn that throws the kimono's sleeve back off the arm, wrist leading the reveal, sandals finding the next step", category: DYNAMIC, risk: MID}
