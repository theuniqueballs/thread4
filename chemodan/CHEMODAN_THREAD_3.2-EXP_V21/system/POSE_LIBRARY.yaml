- {id: PL144, name: "Hat-Tip Back", sd: "three-quarter turned away, hat mid-tipped off the head by the brim, one brow up over the shoulder", category: VERTICAL, risk: LOW}
- {id: PL145, name: "Coat-Flare Pivot", sd: "mid-pivot in a long coat, collar up, hem flared by the turn, one hand in the pocket, the other trailing the arc", category: DYNAMIC, risk: MID}
- {id: PL146, name: "Umbrella Shoulder-Rest", sd: "a closed umbrella hooked over the shoulder like a rifle, contrapposto lean, the rain that hasn't earned the open", category: VERTICAL, risk: LOW}
