# BORN (2026-09-16) from the author's N28 render verdict, verbatim:
# «ты превратил волт в сборище милфух-мамочек в одежде, через которую
# просвечивает нижнее бельё... ты выбрал самый простой способ решения
# задачи, вместо того, чтобы как следует подумать и поэкспериментировать.
# DEGREE-ось схлопнута в один carrier.»
# The fix is not a ban on sheer — it is a POOL of alternative delivery
# mechanisms wide enough that no single stamp can carry a whole batch.
#
# RESEARCH BASE (the «смачный ресёрч» order, 2026-09-16):
#   - Theiss Titillation Theory: «the degree to which a costume is
#     considered sexy is directly dependent upon how accident-prone it
#     appears to be» — the E-class legal basis (imminence of revelation
#     beats revelation).
#   - Gainax bounce — the D-class physics canon.
#   - Zettai ryouiki (絶対領域, «absolute territory») — the S-class skin-
#     framing canon; platform-native tag.
#   - Danbooru attire dialect — the platform's own state vocabulary:
#     taut shirt, torn clothes, open clothes, shirt lift, half-undressed,
#     tanlines, zettai ryouiki. The pool speaks the parser's language.
#   - MPAA ladder — R = «sexually-oriented nudity» without explicitness;
#     the project's R+ = the erotic ceiling before X. Working range, not
#     the edge of the allowed (author directive 2026-09-09).
#
# THE TAXONOMY — 14 classes × 4 mechanism groups × 280 positions.
# A carrier CLASS is a delivery MECHANISM: a distinct way erotic
# information reaches the viewer. Four mechanisms must co-exist per
# R+ frame (CORE-4, RULES §61 / RATING_MAP §4E): the fabric reports,
# the body reports, the position reports, the physics reports.
#
#   MECH: FABRIC   W  — fabric state (30)        the cloth tells
#   MECH: BODY     A  — cleft & mound (14)       the deep geography
#                   B  — shape telegraph (30)    the form reports
#                   C  — seat & cheek (16)       the seat's claims
#                   S  — skin framing (20)       bare-skin bands/frames
#   MECH: POSITION E  — displacement (32)        the garment loses
#                   L  — layer interplay (18)    layers negotiate
#                   U  — situational undress (20) context undresses
#                   F  — presenting & spread (14) the pose offers
#   MECH: PHYSICS  D  — kinetic weight (28)      weight in motion
#                   M  — compression & press (16) external forces
#                   I  — imprint & aftermath (18) physics receipts
#   AMPLIFIER      G  — aggressive framing (12)  camera serves the zone
#                   H  — reaction physiology (12) her body answers
#   (G/H never count toward CORE-4 — they amplify, they don't deliver.)
#
# THE THREE LADDERS (the DEGREE axis rebuilt):
#   1. INTER-CLASS diversity — CORE-4: ≥4 classes × all 4 mechanisms.
#   2. INTRA-CLASS degree — every entry carries deg L/M/H:
#      L = suggest (the state reads at second glance)
#      M = state (the state reads immediately)
#      H = claim (the state is the frame's subject)
#      An R+ stack of four M-carriers beats one H-carrier + filler.
#   3. INTER-BATCH rotation — §17B counts any one noun-phrase >2/batch;
#      the pool feeds variety, quotes are forbidden (draw PATTERNS).
#
# PH DOCTRINE: every entry is noun-led by construction (§4D-3): the
# NOUN carries the claim, the verb is allowed to be boring. These
# carriers survive PromptHero's rewrite because their payload is in
# the nouns, not the process-verbs.
#
# MATURITY AFFINITY: entries may carry mat: A/B/C (the §53A registers —
# mature female / adult woman / young woman; ALL adult, 18+, the enemy
# is the chibi, never the range). Affinity is aesthetic direction
# (confidence vs mishap), never a restriction. No affinity = *.
# Batch quota (RULES §61(4)): FAM-A ≤35%, FAM-C ≥15%, R+-subset ≤50%
# any one register.

