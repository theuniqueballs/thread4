═══ APPENDIX C — USAGE DOCTRINE ═══
# 1. DRAW PATTERNS, NOT QUOTES. §17B counts any one noun-phrase >2 per
#    batch; 280 positions exist so that never has to happen. The entry
#    is a MECHANIC (nouns + relation), the prose re-coins it.
# 2. THE NOUN CARRIES THE CLAIM (§4D-3). The verb may be boring; at
#    PH's ~40% survival these entries still read because the payload
#    sits in the nouns and prepositions.
# 3. ASSEMBLY ORDER (the core-4 ritual): first pick the MECHANISM
#    SPREAD (one from each group: fabric / body / position / physics),
#    then degree-tune along the L→H ladder, then maturity-match the
#    register (§53A affinity notes), THEN write prose around the stack.
# 4. EVERY LAYER CARRIER NAMES ITS STACK (§61(3)): what is over what,
#    which opening permits the read. An under-strap exits only through
#    a named route — «лифчик под одеждой, лямки снаружи» is the bug
#    this library exists to make impossible.
# 5. TAG-MIRROR (§60): strong carriers pair with their platform tags
#    (taut shirt, zettai ryouiki, off shoulder, tanlines, open clothes)
#    — the tag-run carries the payload through PH, the prose carries
#    the beauty past it.
# 6. THE WITNESS PRINCIPLE: C/I/M classes are the house register —
#    objects and aftermath testify, the girl doesn't have to display.
#    A strong R+ frame can be carried by evidence alone.
# 7. NICHE FRAMES may run core-3 (three mechanisms) when the theme
#    demands atmosphere over heat — but the gate must be told
#    (NICHE-flag in the pre-header), and the batch's R+ set still
#    averages core-4. The R-exempt doctrine (§4D-3's NICHE note)
#    applies to NICHE-claimed frames, never to R+ claims.
