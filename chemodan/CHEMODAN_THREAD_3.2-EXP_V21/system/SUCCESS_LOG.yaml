SUCCESS_LOG.yaml — THREAD 3.2-EXP-V16 (Path B, MVP-1)
================================================================
The WHITE list — the system's memory of what was actually strong.
Born 2026-09-14 from the author's architecture review («система блестяще
помнит, чего нельзя. Она почти не помнит, что было по-настоящему сильно»).

WHAT FEEDS IT (three sources, in order of authority):
  1. CANONIZATION — the author promoting a frame into OC_CANON. The
     strongest success signal the project has: he liked it enough to
     make it permanent. All six canon births are seeded below.
  2. REPEAT BUSINESS — the author re-ordering a mode he already saw
     rendered (the Vae ELDRITCH-CONTACT precedent).
  3. RENDER VERDICTS — structured post-render feedback (§56C format):
     5 axes x 0-2 + tags, appended per frame. COLD START: the schema is
     live, the data begins with the next render session.

WHAT IT FEEDS (and what it must NEVER feed):
  - §56D CONTROLLED RETURNS (early returns of high-success combos
    before window expiry) draw ONLY on render-verified entries —
    `verification: render` — never on text-level praise.
  - ENGINES.yaml strong-pairs tables (what combinations keep working).
  - The §56E retirement audit (a law that only ever blocks strong
    frames is a suspect law).
  - NEVER: a license to repeat. A strong combo returning early must
    still mutate >= 1 structural axis (camera / LEAD / K) per §56D.

VERDICT AXES (render feedback, 0-2 each — §56C):
  silhouette      0 = muddled mass · 1 = readable · 2 = iconic shape
  lead_read       0 = LEAD zone lost · 1 = present · 2 = first read
  witness         0 = absent/muddy · 1 = present · 2 = dominates frame
  physics_read    0 = reads as filter · 1 = reads as claim · 2 = reads as law
  scroll_stop     0 = scroll past · 1 = pause · 2 = stop + revisit

TAG VOCAB (open set, seed): strong-silhouette · witness-weak ·
  physics-muddy · too-similar-to-<id> · wet-sheer-verified ·
  concept-on-girl-verified · register-survived · palette-punch ·
  quiet-strong · author-reordered

