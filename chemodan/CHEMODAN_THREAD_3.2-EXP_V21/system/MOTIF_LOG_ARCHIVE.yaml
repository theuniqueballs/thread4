experimental_findings:
"v3.2-EXP systems caught 5 hard failures that THREAD 3.0 would have shipped
silently. The self-check footer is the single most valuable addition."
"§20 Causal Gate and §21 Visual Thesis forced every prompt to have a spine —
the single biggest qualitative win. Reading the batch top-to-bottom, no
prompt reads as 'axis-list' — each has a 10-word idea."
"§24 NICHE NCS-Lock cleanly separated NICHE (COVERED) from VOLT (THROUGH+).
No more 'less explicit VOLT' confusion."
"§26 VOLT Moment-Before (K-code mandatory) eliminated 'static pose + exposure'
failure mode. Every VOLT reads as mid-motion."
"§28 BPT cap (3 per template) is TOO TIGHT for R+-heavy batches. Suggest
subdivision OR cap raise to 5."
"§29 D19 mandates (ASS/BACK/LEGS/HANDS ≥3 each) conflict with theme-driven
focus. When user requests R+ OC (3 of which are bust-forward), the mandates
need to be theme-adjustable, not absolute."
"§40 candle/lamp ban is clean — no banned words in any POS. The 'richly
pigmented [palette] tones, saturated film color' replacement works well —
the prose reads naturally and gives Tsubaki2 the saturation signal without
the generic-filler problem of the old 'vivid saturated' phrase."
"§17A cross-batch similarity still catches canon-block overlap as 'above 0.4'
— but the manual inspection confirms these are required by §11, not
verbatim duplicates. The canon-exemption in §17A works as designed."
"The 7 NICHE archetypes (§25) gave the NICHE prompts genuinely different
shapes. P01 (SURREAL: body horizontal in steam), P04 (ABSTRACT: silhouette
through condensation), P15 (UNEXPECTED: through-water camera) read as
three different genres, not 'atmospheric girls'. This was the exact goal
of the A7 §3 reformulation in §38."
