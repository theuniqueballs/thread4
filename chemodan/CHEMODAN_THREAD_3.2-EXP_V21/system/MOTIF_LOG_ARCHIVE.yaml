"5 hard constraint failures caught by v3.2-EXP self-check, logged in batch audit footer:"
"C044 BPT rotation: BPT-1 at 7× (cap 3). ROOT CAUSE: 3 OC + 4 main VOLT all feature
bust-forward R+ designs by the user's request for 'объективно эротических промптов
с OC (R+)'. The cap of 3 is too tight for R+-heavy batches. RECOMMEND FIX:
subdivide BPT-1 into BPT-1a (nipple-visible), BPT-1b (under-fabric-tension),
BPT-1c (caught-in-gap), or raise cap to 5 for R+-heavy batches."
"C045 D19 mandates: ASS/LEGS/HANDS at 2 each (need 3). ROOT CAUSE: the user asked
for R+ OC focus, which concentrated on breasts/back. The mandates were designed
for distribution, not theme. Fix for next iteration: swap P12 or P20 to D19=thighs
(mid-arch thigh tension), swap one OC's hand-position to D19=hands, ensure ≥3
ass prompts by swapping one VOLT."
"C046 Light verb pool: 'threads' at 5× (cap 3). ROOT CAUSE: water-theme pulls
the verb naturally. Fix: redistribute 2 instances to unused verbs (scatters,
shatters, crystallizes, absorbs) — 'scatters' would work for P08, 'absorbs'
for P15."
"C047 Closure shuffle: F5 (body-hold) at 7× (cap 6). ROOT CAUSE: VOLT Moment-Before
(§26) encourages body-hold closures. Fix: swap one F5 to F2 (incomplete-action)
— P12 or P20 could end on mid-arch rather than body-hold."
"C048 Opening strategy: setting-led/action-led/dialogue-led each at 4-5× (cap 3).
ROOT CAUSE: water-theme + ritual-settings favor setting-led openings. Fix:
swap 3 prompts to underused (list-led, definition-led, sensory-led at 1× each)."
"Back-view compositions at 4× (cap 2 from RULES §18B). ROOT CAUSE: ASS-MANDATE
(§29) requires ≥3 buttocks prompts, which mostly come from back-to-camera
angles. CONFLICT between §18B (back-view cap 2) and §29 (ass-mandate 3).
RECOMMEND RESOLUTION: raise back-view cap to 3 when ASS-MANDATE is enforced,
OR allow ass-focus from non-back-view cameras (from-below, side-profile
with cheek visible)."
"Highest cross-batch similarity: Hydrography-OC1 vs Undertow-OC3 (Vae both):
0.42 — above the 0.4 threshold, but verified as canon-block overlap (Vae's
obsidian/horns/tail/X-tape required by §11 canon-lock). Not a verbatim prose
duplicate. Acceptable residual per §17A canon-exemption."
"Water as motif at 21/24 (way over soft-cap of 7/21). This is theme-mandated:
the batch is literally about water ('Hydrography'). The motif-cap should be
suspended for theme-defining nouns, the same way the palette quality-tag line
