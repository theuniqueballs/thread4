lls_tier:
description: "STATE axis of the two-axis honesty law (v3.2-EXP-V10, RULES §50): tier = min(state-allowed, degree-earned). The DEGREE axis (carriers x classes x share x framing) lives in RATING_MAP.md + rating_gate_lint.py; this table maps NCS to the state ceiling only."
