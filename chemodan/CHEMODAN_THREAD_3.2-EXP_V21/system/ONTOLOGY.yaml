── BDM (8 dimensions) ───────────────────────────────────────────
bdm:
description: "Body = how it catches light, not anatomy."
dimensions:
B: {range: "1-8", meaning: "breast volume → how shadow falls under breast"}
H: {range: "1-7", meaning: "hip width → shadow between thighs, light on iliac crest"}
T: {range: "1-7", meaning: "thigh volume → light grazing inner thigh"}
W: {range: "0-5", meaning: "waist definition → light convergence point"}
S: {range: "0-3", meaning: "shoulder breadth → light planes for rim"}
HE: {range: "0-4", meaning: "height → shadow length, monumentality"}
MU: {range: "0-3", meaning: "muscle definition → shadow contrast on muscles"}
BD: {range: "0-3", meaning: "body fat → shadow depth in folds"}
banned_values: [B0, H0, T0]
extreme_caps: {B7: 1, B8: 1, H6: 1, H7: 1, T6: 1, T7: 1}
extreme_requires_tier: {B8: L3, H7: L3, T7: L3}

