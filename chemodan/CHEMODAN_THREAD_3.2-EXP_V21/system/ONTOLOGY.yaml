── LIGHT QUALITY ────────────────────────────────────────────────
light_quality:
description: "How light physically behaves. 15 qualities."
values:
- {id: LQ01, name: "Hard Key", sd: "single hard light source, sharp shadow cutting across body, high contrast between lit and unlit skin", pairs_with: [P01, P06, P16]}
- {id: LQ02, name: "Soft Diffused", sd: "large soft diffused light source, gradual shadow falloff, no hard edges on skin", pairs_with: [P02, P09, P10]}
- {id: LQ03, name: "Rim Only", sd: "rim light from behind, body edges glowing, face mostly in shadow, silhouette against light", pairs_with: [P07, P20, P13]}
- {id: LQ04, name: "Under Light", sd: "light source from below, upward shadows on face, chin and nose lit, eyes in shadow", pairs_with: [P11, P15]}
- {id: LQ05, name: "Top-Down Spot", sd: "narrow spotlight from directly above, circular pool of light on body, surroundings in darkness", pairs_with: [P01, P09]}
- {id: LQ06, name: "Bounced Fill", sd: "light bouncing off pale wall onto body, soft even illumination, subtle shadow under chin", pairs_with: [P02, P19]}
- {id: LQ07, name: "Volumetric Beam", sd: "visible light beam through dust particles, body partially inside the beam, motes of light", pairs_with: [P06, P05]}
- {id: LQ08, name: "Colored Gel", sd: "colored gelled light casting colored shadow, skin tinted, complementary shadows", pairs_with: [P03, P16]}
- {id: LQ09, name: "Candle Amber", sd: "flickering warm amber light, unstable shadow movement, warm highlights on closest skin", pairs_with: [P02, P09]}
- {id: LQ10, name: "Overcast Sky", sd: "overcast diffused daylight, flat soft shadows, cool blue-grey ambient tone", pairs_with: [P13, P10]}
- {id: LQ11, name: "Prism Split", sd: "prism splitting light into rainbow across body, spectral highlights on curves, iridescent skin", pairs_with: [P20, P11]}
- {id: LQ12, name: "Blacklight UV", sd: "UV blacklight, white fabric glowing, teeth and eyes fluorescent, dark surroundings", pairs_with: [P03, P15]}
- {id: LQ13, name: "Firelight", sd: "firelight from below, dancing orange-red shadows, warm flicker on skin, ember glow", pairs_with: [P12, P04]}
- {id: LQ14, name: "Moonlight Cool", sd: "cool blue-silver moonlight, long soft shadows, pale desaturated skin, starlight fill", pairs_with: [P07, P08]}
- {id: LQ15, name: "Bioluminescent", sd: "soft bioluminescent glow from within environment, skin tinted by living light, no hard source", pairs_with: [P11, P05]}

